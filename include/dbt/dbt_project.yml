name: data_lyon

profile: data_lyon

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_lyon:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    core:
      +materialized: table
    marts:
      +materialized: table
