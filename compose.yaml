x-common-env-vars: &common-env-vars
  AIRFLOW__API__BASE_URL: "http://localhost:8080"
  AIRFLOW__API__PORT: 8080
  AIRFLOW__API_AUTH__JWT_SECRET: "airflow-data-lyon_12d0e0"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://api-server:8080/execution/"
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: "d6Vefz3G9U_ynXB3cr7y_Ak35tAHkEGAVxuz_B-jzWw="
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://postgres:postgres@postgres:5432
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://postgres:postgres@postgres:5432
  AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: True
  AIRFLOW__API__SECRET_KEY: "airflow-data-lyon_12d0e0"
  ASTRONOMER_ENVIRONMENT: local
  DATASOURCE_DATA_GRAND_LYON_USERNAME: ${DATASOURCE_DATA_GRAND_LYON_USERNAME}
  DATASOURCE_DATA_GRAND_LYON_PASSWORD: ${DATASOURCE_DATA_GRAND_LYON_PASSWORD}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  AWS_S3_URL: ${AWS_S3_URL}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_SCHEMA: ${DB_SCHEMA}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

networks:
  airflow:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  airflow_logs:
    driver: local
  transport_postgres_data:
    driver: local

services:
  postgres:
    image: docker.io/postgres:15
    restart: unless-stopped
    networks:
      - airflow
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  db-migration:
    depends_on:
      - postgres
    image: airflow-data-lyon_12d0e0/airflow:latest
    command:
      - airflow
      - db
      - migrate
    networks:
      - airflow
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-db-migration"
    environment: *common-env-vars

  scheduler:
    depends_on:
      - db-migration
    image: airflow-data-lyon_12d0e0/airflow:latest
    command:
      - airflow
      - scheduler
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-scheduler"
    environment: *common-env-vars
    volumes:
      - C:\Users\Homelander\source\repos\airflow-data-lyon/dags:/usr/local/airflow/dags:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/plugins:/usr/local/airflow/plugins:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/include:/usr/local/airflow/include:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/tests:/usr/local/airflow/tests:z
      
      - C:\Users\Homelander\source\repos\airflow-data-lyon/airflow_settings.yaml:/usr/local/airflow/airflow_settings.yaml:z
      
      
      - airflow_logs:/usr/local/airflow/logs
      
    

  dag-processor:
    depends_on:
      - db-migration
    image: airflow-data-lyon_12d0e0/airflow:latest
    command:
      - airflow
      - dag-processor
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-dag-processor"
    environment: *common-env-vars
    volumes:
      - C:\Users\Homelander\source\repos\airflow-data-lyon/dags:/usr/local/airflow/dags:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/plugins:/usr/local/airflow/plugins:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/include:/usr/local/airflow/include:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/tests:/usr/local/airflow/tests:z
      
      - airflow_logs:/usr/local/airflow/logs
      
    

  api-server:
    depends_on:
      - db-migration
    image: airflow-data-lyon_12d0e0/airflow:latest
    command:
      - airflow
      - api-server
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-api-server"
    environment: *common-env-vars
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - C:\Users\Homelander\source\repos\airflow-data-lyon/dags:/usr/local/airflow/dags:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/plugins:/usr/local/airflow/plugins:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/include:/usr/local/airflow/include:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/tests:/usr/local/airflow/tests:z
      
      - airflow_logs:/usr/local/airflow/logs
      
    

  triggerer:
    depends_on:
      - db-migration
    image: airflow-data-lyon_12d0e0/airflow:latest
    command:
      - airflow
      - triggerer
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-triggerer"
    environment: *common-env-vars
    volumes:
      - C:\Users\Homelander\source\repos\airflow-data-lyon/dags:/usr/local/airflow/dags:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/plugins:/usr/local/airflow/plugins:z
      - C:\Users\Homelander\source\repos\airflow-data-lyon/include:/usr/local/airflow/include:z
      
      - airflow_logs:/usr/local/airflow/logs
      

  postgres_transport:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - airflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - transport_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U "$${DB_USER}" -d "$${DB_NAME}"
      interval: 10s
      timeout: 5s
      retries: 5
